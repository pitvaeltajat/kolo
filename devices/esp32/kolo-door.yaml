# kolo door controller — ESPHome (ESP32-C6 + Yale Doorman L3 over BLE).
#
# What's wired here (kolo-specific, concrete):
#   - MQTT in/out with HMAC-verified commands and signed acks (kolo_crypto.h);
#   - unlock/lock driving the Yale over BLE via a community component;
#   - periodic signed state report.
#
# TODO before rollout (hardware, can't be finished off-device — see README.md):
#   - Pin the community Yale component + its lock schema to your board/firmware
#     (the `external_components` + `lock:` block below are the integration point).
#   - Fill secrets.yaml with the offline key/slot/mac from fetch_offline_key.py.
#   - PN532 + NTAG 424 tag reading is phase 4 (PLAN.md) — a separate custom
#     component; not in this file yet. Door open/close/ack/state comes first.

substitutions:
  device_id: door
  kolo_url: https://kolo.pitva.fi
  # Embedded into the firmware at build. The binary lives in encrypted flash
  # (see README security notes), so compiling the keys in is acceptable here.
  kolo_hmac_key: !secret kolo_hmac_key
  yale_meta_key: !secret yale_meta_key    # shared SDMMetaRead key (32 hex) — decrypts tag PICCData
  tag_master_mac: !secret tag_master_mac  # per-tag MAC key diversification master (32 hex)

globals:
  # Allocated in on_boot from the two tag keys above. Holds the allowlist and
  # per-UID counters in RAM (see kolo_door_tags.h for the NVS caveat).
  - id: door_tags
    type: kolo::DoorTags *
    initial_value: "nullptr"

esphome:
  name: kolo-door
  includes:
    - kolo_crypto.h
    - ntag424_sun.h          # NTAG 424 DNA SUN verification (AN12196, mbedTLS)
    - kolo_door_tags.h       # allowlist + replay + per-UID key derivation
    - ntag424_sun_selftest.h # boot self-test (runs AN12196 vectors on-device)
  libraries:
    - "ArduinoJson"
  on_boot:
    priority: 600
    then:
      - lambda: |-
          // Fail loud if the crypto path is wrong on this chip's mbedTLS build.
          if (!kolo::ntag424_sun_selftest())
            ESP_LOGE("kolo", "NTAG424 self-test FAILED — do not trust tag auth");
          // Build the tag decider from the two tag keys (hex in secrets).
          static uint8_t meta[16], master[16];
          if (kolo::hex_to_bytes("${yale_meta_key}", meta, 16) &&
              kolo::hex_to_bytes("${tag_master_mac}", master, 16)) {
            id(door_tags) = new kolo::DoorTags(meta, master);
          } else {
            ESP_LOGE("kolo", "bad yale_meta_key/tag_master_mac hex — tags disabled");
          }

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf

logger:
  baud_rate: 0 # UART off; this board lives outdoors, log over MQTT/OTA

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

ota:
  - platform: esphome
    password: !secret ota_password

time:
  - platform: sntp
    id: sntp_time

mqtt:
  id: mqtt_client
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  # TLS: add `certificate_authority:` per your broker.
  on_message:
    - topic: kolo/door/cmd
      then:
        - lambda: |-
            #include <ArduinoJson.h>
            // Verify the envelope: sig = HMAC(key, payload-bytes).
            DynamicJsonDocument env(512);
            if (deserializeJson(env, x)) return;
            const char *payload = env["payload"] | "";
            const char *sig = env["sig"] | "";
            if (!payload[0] || !sig[0]) return;
            if (!kolo::sig_equal(kolo::hmac_sha256_hex("${kolo_hmac_key}", payload), sig)) {
              ESP_LOGW("kolo", "bad command signature");
              return;
            }
            DynamicJsonDocument body(512);
            if (deserializeJson(body, payload)) return;
            int64_t ts = body["ts"] | (int64_t) 0;
            int64_t now = (int64_t) id(sntp_time).now().timestamp * 1000;
            if (now > 0 && (now - ts > 30000 || ts - now > 30000)) { ESP_LOGW("kolo", "stale cmd"); return; }
            std::string action = body["action"] | "";
            std::string cmd_nonce = body["nonce"] | "";
            // ponytail: nonce replay should be tracked in NVS once enrol/tags
            // land; for unlock/lock the ±30 s window + ack is enough.
            bool ok = false;
            if (action == "unlock") { id(yale_lock).unlock(); ok = true; }
            else if (action == "lock") { id(yale_lock).lock(); ok = true; }
            else if (action == "enroll") { ok = false; } // phase 4
            std::string ack = std::string("{\"device\":\"${device_id}\",\"reply\":\"") + cmd_nonce +
              "\",\"result\":\"" + (ok ? "ok" : "fail") +
              "\",\"ts\":" + to_string(now) + ",\"nonce\":\"" + kolo::random_nonce() + "\"}";
            id(mqtt_client).publish("kolo/door/ack", kolo::envelope("${kolo_hmac_key}", "${device_id}", ack));
    - topic: kolo/door/allowlist
      then:
        - lambda: |-
            #include <ArduinoJson.h>
            #include <vector>
            // Signed envelope, same scheme as cmd. Replaces the whole allowlist.
            DynamicJsonDocument env(4096);
            if (deserializeJson(env, x)) return;
            const char *payload = env["payload"] | "";
            const char *sig = env["sig"] | "";
            if (!payload[0] || !sig[0]) return;
            if (!kolo::sig_equal(kolo::hmac_sha256_hex("${kolo_hmac_key}", payload), sig)) {
              ESP_LOGW("kolo", "bad allowlist signature"); return;
            }
            if (id(door_tags) == nullptr) return;
            DynamicJsonDocument body(4096);
            if (deserializeJson(body, payload)) return;
            std::vector<std::pair<kolo::Uid, std::string>> list;
            for (JsonObject e : body["entries"].as<JsonArray>()) {
              const char *uidhex = e["uid"] | "";
              kolo::Uid uid{};
              if (strlen(uidhex) >= 14 && kolo::hex_to_bytes(uidhex, uid.data(), 7))
                list.emplace_back(uid, std::string(e["member"] | ""));
            }
            id(door_tags)->set_allowlist(std::move(list));
            ESP_LOGI("kolo", "allowlist updated: %d entries", (int) list.size());

# ── Yale lock over BLE (community component) ────────────────────────────────
# Base on a community port (PLAN.md "ESP32 firmware"):
#   splitice/esphome-yale-smartlock  (ESPHome external component)
# Pin a specific commit. Match platform/key names to its README — this block is
# the integration point, not final.
external_components:
  - source: github://splitice/esphome-yale-smartlock
    components: [yale_lock]

lock:
  - platform: yale_lock
    id: yale_lock
    name: "Kolo etuovi"
    mac_address: !secret yale_mac
    offline_key: !secret yale_offline_key
    key_slot: !secret yale_key_slot

# ── Periodic signed state report to kolo ────────────────────────────────────
# Add the `http_request` component and POST `report` to ${kolo_url}/api/state;
# kept as a log line here so the file is meaningful before the board exists.
interval:
  - interval: 60s
    then:
      - lambda: |-
          int64_t now = (int64_t) id(sntp_time).now().timestamp * 1000;
          bool locked = id(yale_lock).state == lock::LOCK_STATE_LOCKED;
          std::string payload = std::string("{\"device\":\"${device_id}\",\"kind\":\"DOOR\",\"locked\":") +
            (locked ? "true" : "false") + ",\"ts\":" + to_string(now) +
            ",\"nonce\":\"" + kolo::random_nonce() + "\"}";
          std::string report = kolo::envelope("${kolo_hmac_key}", "${device_id}", payload);
          ESP_LOGD("kolo", "state → POST ${kolo_url}/api/state : %s", report.c_str());

# ── Tag reader (PN532 + NTAG 424) ───────────────────────────────────────────
# The crypto + decision are DONE and self-tested (ntag424_sun.h, kolo_door_tags.h,
# on_boot self-test above). What remains is hardware-only: reading the tag's SDM
# over ISO-DEP. ESPHome's stock pn532 doesn't expose the APDUs for NTAG 424, so
# this is a small custom component (phase 4). When it has the tap's two fields —
# picc_enc[16] and mac[8], from the SDM file / NDEF — it calls:
#
#     auto d = id(door_tags)->decide(picc_enc, mac);
#     if (d.unlock) {
#       id(yale_lock).unlock();
#       // signed log: {method:"tag", action:"unlock", result:"ok", member:d.member}
#     } else {
#       // signed log with result:"fail", detail:d.reason  (bad_mac/replay/not_allowed)
#     }
#
# Enrol (also phase 4): program a blank NTAG 424 — set file keys and SDM config
# so taps mirror UID+counter+CMAC, with the per-UID MAC key
# ntag424_derive_key(tag_master_mac, uid). Trigger: a signed kolo/door/cmd
# {action:"enroll", member:...}; report the new UID back so kolo adds it.
