<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#334155;stroke-width:1.5}
      .h{font-weight:600;font-size:14px;fill:#0f172a}
      .t{fill:#334155}
      .s{fill:#64748b;font-size:12px}
      .m{font-family:Menlo, Consolas, monospace;font-size:12px;fill:#334155}
      .ln{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .sync{stroke:#64748b;stroke-width:1.4;fill:none;stroke-dasharray:6 4;marker-end:url(#a)}
      .safe{stroke:#b45309;stroke-width:1.6;fill:none;marker-end:url(#w)}
      .n{fill:#0f172a;font-weight:700;font-size:12px}
      .nb{fill:#fde68a;stroke:#b45309}
    </style>
  </defs>

  <rect width="1000" height="800" fill="#f8fafc"/>
  <text x="20" y="30" class="h" style="font-size:17px">Pitkäjärven Vaeltajat – heating control (Shelly + MQTT)</text>
  <text x="740" y="80" class="s">solid = setpoint / command</text>
  <text x="740" y="98" class="s">dashed = temps &amp; acks</text>
  <text x="740" y="116" class="s" fill="#b45309">amber = safety override</text>

  <!-- Google Workspace -->
  <rect x="300" y="50" width="420" height="104" rx="10" class="box" fill="#eef6ff"/>
  <text x="316" y="74" class="h">Google Workspace</text>
  <text x="316" y="96" class="t">• Sign in with Google (own domain only)</text>
  <text x="316" y="116" class="t">• Calendar bookings → heating plan (pre-heat 2 h)</text>
  <text x="316" y="136" class="t">• Group <tspan class="m">jäsenet@…</tspan> may boost</text>

  <!-- Phone -->
  <rect x="20" y="206" width="190" height="96" rx="10" class="box"/>
  <text x="36" y="232" class="h">Member's phone</text>
  <text x="36" y="254" class="t">web app: <tspan class="m">“Lämpö 3 h”</tspan></text>
  <text x="36" y="274" class="s">admin: zone targets</text>
  <text x="36" y="292" class="s">shows temps + plan</text>

  <!-- Vercel -->
  <rect x="260" y="190" width="260" height="150" rx="10" class="box" fill="#f1f5f9"/>
  <text x="276" y="214" class="h">Vercel (Next.js)</text>
  <text x="276" y="236" class="m">cron /api/cron/heating · 15 min</text>
  <text x="276" y="254" class="m">POST /api/heating/boost</text>
  <text x="276" y="272" class="m">POST …/setpoint (admin)</text>
  <text x="276" y="296" class="t">reads calendar, computes</text>
  <text x="276" y="314" class="t">setpoint + 7-day schedule</text>
  <text x="276" y="332" class="s">policy + schedule live here</text>

  <!-- MQTT -->
  <rect x="570" y="206" width="190" height="96" rx="10" class="box" fill="#fff7ed"/>
  <text x="586" y="232" class="h">MQTT broker</text>
  <text x="586" y="252" class="t">Mosquitto · Lightsail TLS</text>
  <text x="586" y="272" class="s">relays only, untrusted:</text>
  <text x="586" y="288" class="s">commands HMAC-signed</text>

  <!-- Site -->
  <rect x="20" y="372" width="960" height="394" rx="12" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="36" y="396" class="h">On site – Kolo (separate building · own Wi-Fi · no new internet)</text>
  <rect x="24" y="408" width="300" height="350" fill="#e0f2fe" opacity="0.4"/>
  <rect x="536" y="408" width="440" height="350" fill="#dcfce7" opacity="0.4"/>
  <text x="40" y="428" class="s">DOWNSTAIRS · cabinet K2</text>
  <text x="552" y="428" class="s">UPSTAIRS</text>

  <!-- Downstairs sensor -->
  <rect x="40" y="436" width="250" height="38" rx="8" class="box"/>
  <text x="54" y="460" class="t">Downstairs sensor → zone</text>

  <!-- Downstairs Shelly Pro 3 -->
  <rect x="40" y="484" width="250" height="96" rx="8" class="box"/>
  <text x="54" y="508" class="h">Shelly Pro 3</text>
  <text x="54" y="528" class="t">replaces old relay in K2</text>
  <text x="54" y="546" class="t">local hysteresis thermostat</text>
  <text x="54" y="564" class="s">caches 7-day schedule</text>

  <!-- 3 contactors -->
  <rect x="40" y="594" width="250" height="50" rx="8" class="box"/>
  <text x="54" y="624" class="t">3 existing contactors</text>

  <!-- 5 radiators -->
  <rect x="40" y="658" width="250" height="80" rx="8" class="box"/>
  <text x="54" y="682" class="h">5 radiators</text>
  <text x="54" y="702" class="t">entrance · kitchen</text>
  <text x="54" y="720" class="t">· meeting rooms</text>

  <!-- Upstairs sensor -->
  <rect x="540" y="436" width="250" height="38" rx="8" class="box"/>
  <text x="554" y="460" class="t">Upstairs sensor → zone</text>

  <!-- Upstairs Shellys -->
  <rect x="540" y="484" width="250" height="96" rx="8" class="box"/>
  <text x="554" y="508" class="h">2 × Shelly 1 Gen4, 16 A</text>
  <text x="554" y="528" class="t">one per radiator</text>
  <text x="554" y="546" class="t">local hysteresis thermostat</text>
  <text x="554" y="564" class="s">caches 7-day schedule</text>

  <!-- Upstairs radiators -->
  <rect x="540" y="658" width="250" height="80" rx="8" class="box"/>
  <text x="554" y="682" class="h">2 × 2 kW radiators</text>
  <text x="554" y="702" class="t">switched directly</text>
  <text x="554" y="720" class="s">(no contactor)</text>

  <!-- Wall button -->
  <rect x="330" y="484" width="200" height="76" rx="10" class="box"/>
  <text x="344" y="508" class="h">Wall button</text>
  <text x="344" y="528" class="t">Lämpö 3 h → local boost</text>
  <text x="344" y="548" class="s">works without internet</text>

  <!-- Fail-safe -->
  <rect x="330" y="586" width="200" height="118" rx="10" class="box" fill="#fff7ed" stroke="#b45309"/>
  <text x="344" y="610" class="h" fill="#b45309">Coldest-pipe sensor</text>
  <text x="344" y="632" class="t">forces heat on &lt; +5 °C</text>
  <text x="344" y="654" class="t">fault state → heat</text>
  <text x="344" y="672" class="t">stays ON</text>
  <text x="344" y="692" class="s">never leaves it unheated</text>

  <!-- ===== Arrows: command path ===== -->
  <!-- 1 calendar -> vercel -->
  <path d="M380,154 L380,190" class="ln"/>
  <circle cx="380" cy="172" r="10" class="nb"/><text x="376" y="176" class="n">1</text>
  <text x="396" y="176" class="s">reads bookings</text>

  <!-- 2 phone -> vercel -->
  <path d="M210,250 L258,250" class="ln"/>
  <circle cx="234" cy="234" r="10" class="nb"/><text x="230" y="238" class="n">2</text>
  <text x="128" y="330" class="s">boost / targets</text>

  <!-- 3 vercel -> mqtt -->
  <path d="M520,250 L568,250" class="ln"/>
  <circle cx="544" cy="234" r="10" class="nb"/><text x="540" y="238" class="n">3</text>
  <text x="430" y="196" class="s">signed setpoint + 7-day schedule</text>

  <!-- 4 mqtt -> shellys -->
  <path d="M655,302 L175,484" class="ln"/>
  <path d="M700,302 L655,484" class="ln"/>
  <circle cx="690" cy="332" r="10" class="nb"/><text x="686" y="336" class="n">4</text>
  <text x="706" y="336" class="s">TLS over Wi-Fi, verified on device</text>

  <!-- sensors -> shellys -->
  <path d="M150,474 L150,484" class="ln"/>
  <path d="M650,474 L650,484" class="ln"/>

  <!-- 5 downstairs switching -->
  <path d="M150,580 L150,594" class="ln"/>
  <path d="M150,644 L150,658" class="ln"/>
  <circle cx="186" cy="620" r="10" class="nb"/><text x="182" y="624" class="n">5</text>
  <text x="202" y="624" class="s">switches circuits</text>

  <!-- upstairs switching -->
  <path d="M650,580 L650,658" class="ln"/>

  <!-- wall button -> downstairs shelly (local) -->
  <path d="M330,520 L292,520" class="ln"/>

  <!-- fail-safe overrides -->
  <path d="M330,616 L292,552" class="safe"/>
  <path d="M530,616 L538,552" class="safe"/>

  <!-- telemetry back -->
  <path d="M300,500 L615,312" class="sync"/>
  <text x="470" y="360" class="s">temps · acks</text>
</svg>
