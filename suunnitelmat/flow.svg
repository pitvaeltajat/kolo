<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#334155;stroke-width:1.5}
      .h{font-weight:600;font-size:14px;fill:#0f172a}
      .t{fill:#334155}
      .s{fill:#64748b;font-size:12px}
      .m{font-family:Menlo, Consolas, monospace;font-size:12px;fill:#334155}
      .ln{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .bi{stroke:#334155;stroke-width:1.6;fill:none;marker-end:url(#a);marker-start:url(#a)}
      .sync{stroke:#64748b;stroke-width:1.4;fill:none;stroke-dasharray:6 4;marker-end:url(#a)}
      .n{fill:#0f172a;font-weight:700;font-size:12px}
      .nb{fill:#fde68a;stroke:#b45309}
    </style>
  </defs>

  <rect width="1000" height="760" fill="#f8fafc"/>
  <text x="20" y="30" class="h" style="font-size:17px">Pitkäjärven Vaeltajat – door access (ESP32 only)</text>
  <text x="760" y="80" class="s">solid = unlock path</text>
  <text x="760" y="98" class="s">dashed = logs</text>

  <!-- Google Workspace -->
  <rect x="300" y="50" width="420" height="104" rx="10" class="box" fill="#eef6ff"/>
  <text x="316" y="74" class="h">Google Workspace</text>
  <text x="316" y="96" class="t">• Sign in with Google (own domain only)</text>
  <text x="316" y="116" class="t">• Group <tspan class="m">ovi@…</tspan> = who may open the door</text>
  <text x="316" y="136" class="t">• Sheet: access log + tag → member</text>

  <!-- Phone -->
  <rect x="20" y="206" width="190" height="96" rx="10" class="box"/>
  <text x="36" y="232" class="h">Member's phone</text>
  <text x="36" y="254" class="t">web app, one “Open”</text>
  <text x="36" y="272" class="t">button</text>

  <!-- Vercel -->
  <rect x="260" y="190" width="260" height="150" rx="10" class="box" fill="#f1f5f9"/>
  <text x="276" y="214" class="h">Vercel (Next.js)</text>
  <text x="276" y="236" class="m">POST /api/unlock</text>
  <text x="276" y="254" class="m">POST /api/log</text>
  <text x="276" y="276" class="t">group check, admin page:</text>
  <text x="276" y="294" class="t">tags, “enrol next tag”</text>
    <text x="276" y="316" class="s">policy + log live here</text>

  <!-- MQTT -->
  <rect x="570" y="206" width="190" height="96" rx="10" class="box" fill="#fff7ed"/>
  <text x="586" y="232" class="h">MQTT broker</text>
  <text x="586" y="254" class="t">HiveMQ / EMQX free</text>
  <text x="586" y="272" class="s">relays only, untrusted:</text>
  <text x="586" y="288" class="s">commands HMAC-signed</text>

  <!-- Site -->
  <rect x="20" y="370" width="960" height="370" rx="12" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="36" y="394" class="h">On site – PitVan kolo, Etuovi</text>
  <rect x="21" y="404" width="458" height="335" fill="#e0f2fe" opacity="0.55"/>
  <text x="36" y="422" class="s">OUTSIDE (down to –30 °C)</text>
  <rect x="480" y="404" width="10" height="335" fill="#94a3b8"/>
  <text x="506" y="422" class="s">INSIDE (heated)</text>

  <!-- Outdoor box -->
  <rect x="40" y="436" width="420" height="214" rx="12" fill="#fdf4ff" stroke="#334155" stroke-width="1.8"/>
  <text x="56" y="458" class="h">Outdoor box – IP65 polycarbonate, vent, tamper switch</text>
  <rect x="56" y="474" width="140" height="86" rx="8" class="box"/>
  <text x="68" y="496" class="h">PN532</text>
  <text x="68" y="516" class="t">NFC reader</text>
  <text x="68" y="534" class="t">+ LED, buzzer</text>
  <rect x="212" y="474" width="234" height="164" rx="8" class="box"/>
  <text x="224" y="496" class="h">ESP32 – does everything</text>
  <text x="224" y="516" class="t">• Yale BLE driver (offline key)</text>
  <text x="224" y="534" class="t">• NTAG 424 verify + enrol</text>
  <text x="224" y="552" class="t">• cached allowlist</text>
  <text x="224" y="570" class="t">• MQTT, checks signatures</text>
  <text x="224" y="588" class="t">• queues logs while offline</text>
  <text x="224" y="612" class="s">flash encryption + secure boot</text>
  <text x="224" y="628" class="s">tags work without internet</text>
  <path d="M196,516 L210,516" class="ln"/>
  <text x="68" y="584" class="s">I²C / SPI,</text>
  <text x="68" y="600" class="s">short wires</text>

  <rect x="56" y="676" width="160" height="52" rx="10" class="box"/>
  <text x="68" y="698" class="h">NTAG 424 DNA tag</text>
  <text x="68" y="716" class="s">AES-signed, ~1.5–2 €</text>
  <path d="M126,674 L126,652" class="ln"/>
  <circle cx="150" cy="663" r="10" class="nb"/><text x="146" y="667" class="n">6</text>
  <text x="166" y="667" class="s">tap</text>

  <!-- Inside -->
  <rect x="700" y="436" width="160" height="110" rx="10" class="box"/>
  <text x="716" y="460" class="h">Doorman L3</text>
  <text x="716" y="482" class="t">inner unit</text>
  <text x="716" y="500" class="t">2–3 PINs kept</text>
  <text x="716" y="518" class="t">as offline fallback</text>

  <rect x="700" y="584" width="160" height="96" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="716" y="608" class="t" style="font-weight:600">Connect bridge</text>
  <text x="716" y="630" class="s">keep for Yale app;</text>
  <text x="716" y="646" class="s">unplug if BLE conflicts</text>
  <path d="M780,582 L780,548" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/>

  <rect x="510" y="596" width="150" height="70" rx="10" class="box"/>
  <text x="524" y="620" class="h">5 V supply</text>
  <text x="524" y="640" class="s">indoor socket</text>
  <path d="M508,630 L462,630" class="ln"/>
  <text x="510" y="690" class="s">2-core 5 V cable</text>
  <text x="510" y="706" class="s">through the wall</text>

  <!-- Arrows: unlock path -->
  <path d="M210,254 L258,254" class="ln"/>
  <circle cx="234" cy="238" r="10" class="nb"/><text x="230" y="242" class="n">1</text>

  <path d="M380,188 L380,156" class="ln"/>
  <path d="M410,156 L410,188" class="ln"/>
  <circle cx="440" cy="172" r="10" class="nb"/><text x="436" y="176" class="n">2</text>
  <text x="456" y="176" class="s">group check, log</text>

  <path d="M520,254 L568,254" class="ln"/>
  <circle cx="544" cy="238" r="10" class="nb"/><text x="540" y="242" class="n">3</text>

  <path d="M640,304 L420,472" class="bi"/>
  <circle cx="601" cy="334" r="10" class="nb"/><text x="597" y="338" class="n">4</text>
  <text x="618" y="338" class="s">TLS over site Wi-Fi, opened by ESP32</text>

  <path d="M446,520 L698,520" class="ln"/>
  <circle cx="600" cy="504" r="10" class="nb"/><text x="596" y="508" class="n">5</text>
  <text x="510" y="540" class="s">BLE through the door</text>

  <!-- Logs -->
  <path d="M300,472 L300,334" class="sync"/>
  <text x="308" y="358" class="s">logs</text>
</svg>
